[project]
name = "taskforge"
version = "0.1.0"
description = "A task execution platform: submit a command, run it sandboxed with a timeout, get a structured result."
readme = "README.md"
authors = [
    { name = "xiaoxuandong", email = "xiaoxuan.dong@nyu.edu" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]


# ---------- 工具配置 ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W=代码风格, F=逻辑错误, I=import 排序, UP=用新语法, B=常见 bug
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true                  # 最严格模式：所有函数都必须有类型标注
warn_unreachable = true        # 永远执行不到的代码要报警

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: 真的要等（起子进程、睡够超时）的测试，跑得慢但不依赖外部服务",
    "integration: 需要外部依赖（数据库、Redis、Docker）的测试，第 6 课起使用",
]
